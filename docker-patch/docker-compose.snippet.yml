# Drop-in patch for the `ghost:` service in your existing compose.
# Bind-mounts the four template directories over the originals inside ghost:6.
# No Dockerfile, no image build — just paths.
#
# Assumes this folder lives at <repo-root>/ghost-mail-templates/docker-patch/.
# Adjust the relative paths if you placed it elsewhere.
#
# Comment out any volume line to keep Ghost's defaults for that email category.

services:
  ghost:
    image: ghost:6.32.0
    restart: always
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: example
      database__connection__database: ghost
      url: https://${GHOST_HOST}

      tinybird__tracker__endpoint: https://${GHOST_HOST}/.ghost/analytics/api/v1/page_hit
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN}
      tinybird__workspaceId: ${TINYBIRD_WORKSPACE_ID}
      tinybird__tracker__datasource: analytics_events
      tinybird__stats__endpoint: ${TINYBIRD_API_URL}

      mail__transport: SMTP
      mail__options__host: smtp.gmail.com
      mail__options__port: 587
      mail__options__secure: false
      mail__options__auth__user: pytlewskimarcel@gmail.com
      mail__options__auth__pass: ${SMTP_PASSWORD}
      mail__from: "'Pravda' <pytlewskimarcel@gmail.com>"

    volumes:
      - ghost:/var/lib/ghost/content

      # 1. Newsletter — bulk send when publishing a post
      - ./ghost-mail-templates/docker-patch/templates/newsletter:/var/lib/ghost/current/core/server/services/email-service/email-templates:ro

      # 2. System / transactional — magic link, password reset, staff invites, test email
      - ./ghost-mail-templates/docker-patch/templates/system:/var/lib/ghost/current/core/server/services/mail/templates:ro

      # 3. Staff notifications — admin alerts: signups, donations, milestones, etc.
      - ./ghost-mail-templates/docker-patch/templates/staff-notifications:/var/lib/ghost/current/core/server/services/staff/email-templates:ro

      # 4. Member welcome wrapper — the "Welcome to {site}" email shell after signup
      - ./ghost-mail-templates/docker-patch/templates/member-welcome:/var/lib/ghost/current/core/server/services/member-welcome-emails/email-templates:ro

    depends_on:
      - db
      - traffic-analytics
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.ghost.rule=Host(`${GHOST_HOST}`)"
      - "traefik.http.routers.ghost.entrypoints=websecure"
      - "traefik.http.routers.ghost.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ghost.priority=10"
      - "traefik.http.routers.ghost.service=ghost"
      - "traefik.http.services.ghost.loadbalancer.server.port=2368"
      - "traefik.http.middlewares.ghostHeader.headers.customrequestheaders.x-ghost-proxy=true"
      - "traefik.http.routers.ghost.middlewares=ghostHeader"
