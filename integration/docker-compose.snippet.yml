# Add this `mailer:` service to your existing compose.
# It needs to be reachable from the public web (Ghost webhook hits it),
# so it's exposed via Traefik on the same Ghost host under /webhook/*.

services:
  mailer:
    build:
      context: ./ghost-mail-templates/integration
    restart: always
    environment:
      GHOST_URL: https://${GHOST_HOST}
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: "Pravda <newsletter@${MAILGUN_DOMAIN}>"
      WEBHOOK_SECRET: ${MAILER_WEBHOOK_SECRET}
      SITE_URL: https://${GHOST_HOST}
      SITE_TITLE: Pravda
      PORT: 3000
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mailer.rule=Host(`${GHOST_HOST}`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.mailer.entrypoints=websecure"
      - "traefik.http.routers.mailer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mailer.priority=200"
      - "traefik.http.services.mailer.loadbalancer.server.port=3000"
